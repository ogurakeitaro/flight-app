
<!DOCTYPE html>
<html>

<body>

<style>

#currentTime {

    text-align: right;

    margin-bottom: 0px;

}

#flightSection {

    margin-left: auto;

    width: 90%;

    max-width: 400px;

}

#topPanel {

    display: flex;

    justify-content: space-around;

    align-items: flex-start;

    flex-wrap: wrap;

}
    
#flightList {

    max-height: 250px;

    overflow-y: auto;

    border: 1px solid lightgray;

    padding: 10px;

}
    
</style>     
       
<h1>🚁 飛行時間管理</h1>

<div id="currentTime">
現在時刻
<br>
<span id="now"></span>
</div>

<div id="flightSection">

<h2>並び順</h2>

<select id="sortOrder" onchange="displayFlights()">
    <option value="new">新しい順</option>
    <option value="old" selected>古い順</option>
</select>

<h2>登録済みフライト</h2>

<ul id="flightList">
</ul>

</div>    
       
<p>離陸日時</p>
<input type="datetime-local" id="dep">

<p>着陸日時</p>
<input type="datetime-local" id="arr">

<br><br>

<button onclick="saveFlight()">
登録
</button>

<button onclick="clearFlights()">
全削除
</button>

<div id="topPanel">  
    
<div>

<h2>24時間累計</h2>

<div id="total24">
 

0時間0分

</div>    

</div>

<div>
    
<h2>希望飛行時間</h2>

時間
<input type="number"
       id="reqHours"
       value="1"
       min="0"
       max="8"
       onchange="calculateEarliest()">

分
<input type="number"
       id="reqMinutes"
       value="30"
       min="0"
       max="59"
       onchange="calculateEarliest()">

<br><br>

<button onclick="calculateEarliest()">
飛行可能時刻を計算
</button>

</div>   
    
<div>

<h2>飛行可能時刻</h2>

<div id="earliest">
未計算
</div>

</div>
<div>

<h2>あと飛べる時間</h2>

<div id="remaining">
8時間0分
</div>

</div>

</div>    

<script>

let flights =
    JSON.parse(
        localStorage.getItem("flights")
    ) || [];

calculate24Hours();
calculateRemaining();
calculateEarliest();

function saveFlight() {

    let dep =
        document.getElementById("dep").value;

    let arr =
        document.getElementById("arr").value;

    if (!dep || !arr) {
        alert("日時を入力してください");
        return;
    }

　 if (new Date(dep) >= new Date(arr)) {

    alert("着陸日時は離陸日時より後にしてください");

    return;

}
       
    flights.push({
        dep: dep,
        arr: arr
    });

    localStorage.setItem(
        "flights",
        JSON.stringify(flights)
    );

    displayFlights();
    calculate24Hours();
    calculateRemaining();
    calculateEarliest();

}

function displayFlights() {

    let sortElement =
        document.getElementById("sortOrder");

    let sortOrder =
        sortElement ?
        sortElement.value :
        "new";

    if (sortOrder === "old") {

    flights.sort((a,b) => {
        return new Date(a.dep) - new Date(b.dep);
    });

} else {

    flights.sort((a,b) => {
        return new Date(b.dep) - new Date(a.dep);
    });

}
       
    let list =
        document.getElementById("flightList");

    list.innerHTML = "";

    flights.forEach((flight,index) => {

        let item =
            document.createElement("li");

        let depDate = new Date(flight.dep);

let arrDate = new Date(flight.arr);

let flightMinutes =
    Math.round(
        (arrDate - depDate) / 60000
    );

let flightHours =
    Math.floor(flightMinutes / 60);

let flightMins =
    flightMinutes % 60;

item.innerHTML =
    depDate.toLocaleString() +
    " → " +
    arrDate.toLocaleString() +
    "<br>飛行時間 " +
    flightHours +
    "時間" +
    flightMins +
    "分 " +
    ' <button onclick="deleteFlight(' +
    index +
    ')">削除</button>';

        list.appendChild(item);

    });

}

function calculate24Hours() {

    let now = new Date();

    let start24 =
        new Date(
            now.getTime() -
            24 * 60 * 60 * 1000
        );

    let totalHours = 0;

    flights.forEach(flight => {

        let dep =
            new Date(flight.dep);

        let arr =
            new Date(flight.arr);

        if (
            arr > start24 &&
            dep < now
        ) {

            let overlapStart =
                new Date(
                    Math.max(dep, start24)
                );

            let overlapEnd =
                new Date(
                    Math.min(arr, now)
                );

            totalHours +=
                (overlapEnd - overlapStart)
                / 3600000;

        }

    });

    let totalMinutes =
    Math.round(totalHours * 60);

let hours =
    Math.floor(totalMinutes / 60);

let mins =
    totalMinutes % 60;

    document.getElementById("total24")
        .innerHTML =
        hours + "時間" +
        mins + "分";

}

function calculateRemaining() {

    let now = new Date();

    let start24 =
        new Date(
            now.getTime() -
            24 * 60 * 60 * 1000
        );

    let totalHours = 0;

    flights.forEach(flight => {

        let dep =
            new Date(flight.dep);

        let arr =
            new Date(flight.arr);

        if (
            arr > start24 &&
            dep < now
        ) {

            let overlapStart =
                new Date(
                    Math.max(dep, start24)
                );

            let overlapEnd =
                new Date(
                    Math.min(arr, now)
                );

            totalHours +=
                (overlapEnd - overlapStart)
                / 3600000;

        }

    });

    let remaining =
        Math.max(0, 8 - totalHours);

    let totalMinutes =
        Math.round(remaining * 60);

    let hours =
        Math.floor(totalMinutes / 60);

    let mins =
        totalMinutes % 60;

    document.getElementById("remaining")
        .innerHTML =
        hours + "時間" +
        mins + "分";

}


function clearFlights() {

    if(confirm("全て削除しますか？")) {

        flights = [];

        localStorage.removeItem("flights");

        displayFlights();
        calculate24Hours();
        calculateRemaining();
        calculateEarliest();
    }

}

function deleteFlight(index) {

    flights.splice(index,1);

    localStorage.setItem(
        "flights",
        JSON.stringify(flights)
    );

    displayFlights();
    calculate24Hours();
    calculateRemaining();
    calculateEarliest();

}

function calculateHoursAtTime(checkTime) {

    let start24 =
        new Date(
            checkTime.getTime()
            - 24 * 60 * 60 * 1000
        );

    let totalHours = 0;

    flights.forEach(flight => {

        let dep =
            new Date(flight.dep);

        let arr =
            new Date(flight.arr);

        if (
            arr > start24 &&
            dep < checkTime
        ) {

            let overlapStart =
                new Date(
                    Math.max(dep,start24)
                );

            let overlapEnd =
                new Date(
                    Math.min(arr,checkTime)
                );

            totalHours +=
                (overlapEnd - overlapStart)
                / 3600000;
        }

    });

    return totalHours;
}

function calculateEarliest() {

    let reqHours =
        Number(
            document.getElementById("reqHours").value
        );

    let reqMinutes =
        Number(
            document.getElementById("reqMinutes").value
        );

    let requestTime =
        reqHours +
        (reqMinutes / 60);

    let t =
    new Date();

let count = 0;

while (
    calculateHoursAtTime(t)
    + requestTime > 8
) {

    t =
        new Date(
            t.getTime()
            + 60000
        );

    count++;

    if (count > 100000) {

        alert("計算上限に達しました");

        return;

    }

}

   let hh =
    String(t.getHours())
        .padStart(2,"0");

let mm =
    String(t.getMinutes())
        .padStart(2,"0");

document.getElementById("earliest")
    .innerHTML =
    hh + ":" + mm + "から飛行可能"; 

}

function updateTime() {

    let now = new Date();

    document.getElementById("now")
        .innerHTML =
        now.toLocaleString();

    calculate24Hours();
    calculateRemaining();
    calculateEarliest();

}

displayFlights();

updateTime();

setInterval(updateTime,1000);


       
</script>


</body>


</html>
